# Render Blueprint. If the service was created manually, mirror these settings
# in the dashboard (Render only auto-applies this file for Blueprint services).
services:
  - type: web
    name: lsh26-t035-p12
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the dashboard (marked sync:false so they are not committed):
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # Do NOT add PORT here — Render injects it.
